<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>New Tab</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="light" aria-hidden="true"></div>
  <main class="stage">
    <header class="hero">
      <p class="clock" id="clock"></p>
      <h1 id="greeting">Hello.</h1>
      <p class="sub">Your browsing space.</p>
    </header>
    <form class="search glass" id="search" autocomplete="off" role="search">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m13.5 13.5 4 4"/></svg>
      <input id="q" type="text" placeholder="Search or enter address" aria-label="Search or enter address" spellcheck="false">
      <kbd>/</kbd>
    </form>
    <nav class="sites" id="sites" aria-label="Top sites"></nav>
  </main>
  <script src="newtab.js" type="module"></script>
</body>
</html>
